tasks:
  - id: add-claude-adapter
    type: ai
    worker: agy
    prompt: >
      Create the file src/workers/claudeAdapter.ts. It must implement the CliAdapter
      interface defined in src/workers/cliAdapter.ts (same file, same directory).
      Model it closely after src/workers/agyAdapter.ts, which already implements this
      interface for the `agy` CLI. The new adapter is for the `claude` CLI (Claude Code)
      instead. Use node:child_process spawn (no shell:true), and invoke it as:
      claude --print "<prompt>" --add-dir "<cwd>" --dangerously-skip-permissions
      with cwd set as the child process cwd. Export it as `claudeAdapter` satisfying
      CliAdapter, with name: "claude". Reuse the same timeout/kill logic pattern as
      agyAdapter.ts (10 minute default, SIGKILL on timeout, capture stdout/stderr/exitCode).
      Do not modify any other file.
    files:
      - "src/workers/cliAdapter.ts"
      - "src/workers/agyAdapter.ts"
      - "src/workers/claudeAdapter.ts"
    verify:
      command: "npm run build"
